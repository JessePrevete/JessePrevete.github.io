<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="{{ '/assets/js/theme-init.js' | relative_url }}"></script>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  {% seo %}
</head>
<body>
  <header class="container">
    <button class="icon-button theme-toggle" type="button" aria-label="Switch to dark theme">
      <span class="icon-moon" aria-hidden="true">{% include icons/moon.svg %}</span>
      <span class="icon-sun" aria-hidden="true">{% include icons/sun.svg %}</span>
    </button>
  </header>
  <main class="container">
    <div class="prose">
      {{ content }}
    </div>
  </main>
</body>
</html>
