<!doctype html>
<!--
  Social preview image source (1200x630).
  Open in a browser at exactly 1200x630 and screenshot, or export with
  a headless browser. Not part of the site: tools/ is excluded in _config.yml.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social preview</title>
<style>
  @font-face { font-family: "IBM Plex Sans"; font-weight: 400; src: url("../assets/fonts/IBMPlexSans-Regular-Latin1.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-weight: 500; src: url("../assets/fonts/IBMPlexSans-Medium-Latin1.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url("../assets/fonts/IBMPlexMono-Regular-Latin1.woff2") format("woff2"); }

  html, body { margin: 0; }
  .card {
    width: 1200px;
    height: 630px;
    box-sizing: border-box;
    padding: 88px 96px;
    display: flex;
    flex-direction: column;
    background: #131315;
    color: #ececee;
    font-family: "IBM Plex Sans", sans-serif;
  }
  .path { font-family: "IBM Plex Mono", monospace; font-size: 30px; color: #37f499; margin-bottom: 28px; }
  .name { font-size: 96px; font-weight: 500; line-height: 1.05; letter-spacing: -1px; margin-bottom: 28px; }
  .line { font-size: 40px; line-height: 1.35; color: #a1a1aa; max-width: 900px; }
  .foot { margin-top: auto; border-top: 2px solid #27272a; padding-top: 32px;
          font-family: "IBM Plex Mono", monospace; font-size: 28px; color: #a1a1aa; }
</style>
</head>
<body>
  <div class="card">
    <div class="path">~/jesse-prevete</div>
    <div class="name">Jesse Prevete</div>
    <div class="line">Student working toward a career in cybersecurity.</div>
    <div class="foot">networking · security · analysis</div>
  </div>
</body>
</html>
